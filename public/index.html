<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта повітряних загроз</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --line: #262c35; --text: #e8ecf1; --muted: #8a94a3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 360px; height: 100%; }
  #map { height: 100%; background: #0b0e12; }
  aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0 0 4px; }
  header .sub { color: var(--muted); font-size: 12px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 9px;
    border: 1px solid var(--line); border-radius: 999px; cursor: pointer; user-select: none; background: #11151a; }
  .chip.off { opacity: .35; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  #feed { overflow-y: auto; flex: 1; }
  .item { padding: 11px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: #1b2027; }
  .item .top { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  .item .top svg { width: 20px; height: 20px; flex: none; }
  .item .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .item .txt { font-size: 12.5px; margin-top: 6px; line-height: 1.4; color: #c5ccd6; }
  .item a { color: #6ea8fe; text-decoration: none; }
  .empty { padding: 30px 16px; color: var(--muted); text-align: center; font-size: 13px; }
  footer { padding: 10px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 1.4; }
  #status { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; }
  .dot.bad { background: #ef476f; }
  .pin { filter: drop-shadow(0 2px 3px rgba(0,0,0,.7)); }
  .pin .ring { position: absolute; inset: -6px; border-radius: 50%; border: 2px solid currentColor; opacity: .6; animation: pulse 1.8s infinite; }
  .pin .badge { position: absolute; right: -6px; top: -6px; background: #000c; color: #fff; font-size: 10px; font-weight: 700;
    border-radius: 8px; padding: 0 4px; border: 1px solid currentColor; }
  @keyframes pulse { 0% { transform: scale(.7); opacity: .8; } 100% { transform: scale(1.5); opacity: 0; } }
  .alert-zone { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { fill-opacity: .12; } 50% { fill-opacity: .28; } }
  @media (max-width: 800px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 55% 45%; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <aside>
    <header>
      <h1>🇺🇦 Повітряні загрози</h1>
      <div class="sub" id="status"><span class="dot" id="dot"></span><span id="statusText">Завантаження…</span></div>
    </header>
    <div class="filters" id="filters"></div>
    <div id="feed"></div>
    <footer>
      Неофіційний агрегатор відкритих джерел. Дані можуть бути неточними або запізнюватися.
      При тривозі прямуйте в укриття та слідкуйте за офіційними повідомленнями.
    </footer>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const TYPES = {
  shahed:    { label: 'Шахеди',            color: '#ff9f1c', svg: '<path d="M12 2 L21 20 L12 16 L3 20 Z"/>' },
  drone:     { label: 'БпЛА / дрони',      color: '#ffd166', svg: '<circle cx="12" cy="12" r="3"/><circle cx="5" cy="5" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M7 7l3 3M17 7l-3 3M7 17l3-3M17 17l-3-3" stroke="currentColor" stroke-width="1.5" fill="none"/>' },
  cruise:    { label: 'Крилаті ракети',    color: '#ef476f', svg: '<path d="M12 1 L15 8 L15 17 L19 21 L19 22 L12 20 L5 22 L5 21 L9 17 L9 8 Z"/>' },
  ballistic: { label: 'Балістика',         color: '#c1121f', svg: '<path d="M12 23 L15 15 L15 6 L12 1 L9 6 L9 15 Z"/><path d="M9 14 L5 19 L9 18 Z M15 14 L19 19 L15 18 Z"/>' },
  kab:       { label: 'КАБ',               color: '#d98324', svg: '<ellipse cx="12" cy="14" rx="5" ry="8"/><path d="M8 3h8l-1 4H9z"/>' },
  missile:   { label: 'Ракети (інше)',     color: '#ff5d8f', svg: '<path d="M12 2 L16 9 L16 18 L12 22 L8 18 L8 9 Z"/>' },
  mlrs:      { label: 'РСЗВ',              color: '#9d4edd', svg: '<path d="M4 18 L20 8 L21 10 L5 20 Z"/><circle cx="7" cy="19" r="2.5"/>' }
};
const enabled = Object.fromEntries(Object.keys(TYPES).map(k => [k, true]));

const map = L.map('map', { zoomControl: true }).setView([48.7, 31.2], 6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap, &copy; CARTO', maxZoom: 12, minZoom: 5
}).addTo(map);
const markers = L.layerGroup().addTo(map);
const zones = L.layerGroup().addTo(map);

function icon(type) {
  const t = TYPES[type];
  return `<svg viewBox="0 0 24 24" fill="${t.color}" style="color:${t.color}" xmlns="http://www.w3.org/2000/svg">${t.svg}</svg>`;
}

function ago(ts) {
  const m = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if (m < 1) return 'щойно';
  if (m < 60) return m + ' хв тому';
  return Math.floor(m / 60) + ' год ' + (m % 60) + ' хв тому';
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

const filtersEl = document.getElementById('filters');
for (const [k, t] of Object.entries(TYPES)) {
  const el = document.createElement('div');
  el.className = 'chip';
  el.innerHTML = `<i style="background:${t.color}"></i>${t.label}`;
  el.onclick = () => { enabled[k] = !enabled[k]; el.classList.toggle('off', !enabled[k]); render(); };
  filtersEl.appendChild(el);
}

let data = { events: [], alerts: [], ttlMinutes: 90 };

function render() {
  markers.clearLayers();
  zones.clearLayers();

  for (const a of data.alerts) {
    L.circle([a.lat, a.lng], { radius: 55000, color: '#ef476f', weight: 1, fillColor: '#ef476f', className: 'alert-zone' })
      .bindTooltip(`Повітряна тривога: ${esc(a.name)}`).addTo(zones);
  }

  const list = data.events.filter(e => enabled[e.type]);
  const now = Date.now();
  const ttl = data.ttlMinutes * 60000;

  const used = {};
  for (const e of list) {
    if (!e.place) continue;
    const key = e.place.lat + ',' + e.place.lng;
    const n = used[key] = (used[key] || 0) + 1;
    const angle = n * 2.4;
    const off = n === 1 ? 0 : 0.05 * Math.sqrt(n);
    const lat = e.place.lat + off * Math.sin(angle);
    const lng = e.place.lng + off * Math.cos(angle) * 1.5;
    const age = Math.min(1, (now - e.ts) / ttl);
    const color = TYPES[e.type].color;
    const html = `<div class="pin" style="color:${color};opacity:${(1 - age * 0.55).toFixed(2)};position:relative;width:30px;height:30px">
        ${age < 0.25 ? '<div class="ring"></div>' : ''}${icon(e.type)}
        ${e.count ? `<div class="badge">${e.count}</div>` : ''}</div>`;
    L.marker([lat, lng], { icon: L.divIcon({ html, className: '', iconSize: [30, 30], iconAnchor: [15, 15] }) })
      .bindPopup(`<b>${TYPES[e.type].label}</b>${e.count ? ' × ' + e.count : ''}<br>${esc(e.place.name)}<br><small>${ago(e.ts)} · ${esc(e.source)}</small><br>${esc(e.text)}`)
      .addTo(markers);
  }

  const feed = document.getElementById('feed');
  if (!list.length) {
    feed.innerHTML = '<div class="empty">Наразі немає активних повідомлень за вибраними типами.</div>';
    return;
  }
  feed.innerHTML = list.map((e, i) => `
    <div class="item" data-i="${i}">
      <div class="top">${icon(e.type)}<span>${TYPES[e.type].label}${e.count ? ' × ' + e.count : ''}${e.place ? ' — ' + esc(e.place.name) : ''}</span></div>
      <div class="meta">${ago(e.ts)} · ${esc(e.source)} · <a href="${esc(e.link)}" target="_blank" rel="noopener">джерело</a></div>
      <div class="txt">${esc(e.text)}</div>
    </div>`).join('');
  feed.querySelectorAll('.item').forEach(el => {
    el.onclick = ev => {
      if (ev.target.tagName === 'A') return;
      const e = list[+el.dataset.i];
      if (e.place) map.flyTo([e.place.lat, e.place.lng], 8, { duration: 0.6 });
    };
  });
}

async function load() {
  const dot = document.getElementById('dot');
  const txt = document.getElementById('statusText');
  try {
    const r = await fetch('/api/events', { cache: 'no-store' });
    data = await r.json();
    const srcs = Object.values(data.status.sources || {});
    const okCount = srcs.filter(s => s.ok).length;
    dot.className = 'dot' + (okCount ? '' : ' bad');
    txt.textContent = `Джерел активно: ${okCount}/${srcs.length || 0} · подій: ${data.events.length} · оновлено ${new Date().toLocaleTimeString('uk-UA')}`;
    render();
  } catch (e) {
    dot.className = 'dot bad';
    txt.textContent = 'Немає зв’язку з сервером';
  }
}
load();
setInterval(load, 10000);
</script>
</body>
</html>
